name: Bug report
description: Report an incorrect result, application failure, or reproducibility problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected result
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      description: Include checkpoint, region, segment, edited features, and complete error output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Package, Python, and operating-system versions
    validations:
      required: true
